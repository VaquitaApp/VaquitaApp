name: CI/CD Completo (Test y Deploy)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # JOB 1: Validar todo el proyecto
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      # --- BLOQUE DEL SERVIDOR ---
      - name: Instalar dependencias del Servidor
        run: npm ci
        working-directory: ./server

      - name: Ejecutar pruebas del Servidor
        run: npm test
        working-directory: ./server
        continue-on-error: true # Sigue adelante aunque fallen los tests

      # --- BLOQUE DEL CLIENTE ---
      - name: Instalar dependencias del Cliente
        run: npm ci
        working-directory: ./client

      - name: Validar compilación del Cliente
        run: npm run build --if-present
        working-directory: ./client

      # --- NOTIFICACIÓN A SLACK (Se ejecuta SIEMPRE al final) ---
      - name: Notificar resultado a Slack
        uses: rtCamp/action-slack-notify@v2
        if: always() # Obliga a que corra tanto si el pipeline pasa como si falla
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Estado del Pipeline - VaquitaApp"
          SLACK_MESSAGE: "El pipeline de validación ha terminado su ejecución. Revisa los detalles en GitHub Actions."
          SLACK_COLOR: ${{ job.status }} # Se pone verde si pasó, o rojo/naranja si hubo caídas
