name: CI/CD Completo (Test, E2E y Deploy)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Pruebas unitarias + integración + lint cliente
  # ──────────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Instalar dependencias del Servidor
        run: npm ci
        working-directory: ./server

      - name: Ejecutar pruebas del Servidor
        run: npm test
        working-directory: ./server
        env:
          PORT: 3001
          MONGO_URI: mongodb://localhost:27017/vaquitaapp_test
          JWT_SECRET: super_clave_secreta_para_los_tests_de_github_actions
          JWT_EXPIRES_IN: 7d
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_FROM: noreply@vaquitaapp.local
          APP_BASE_URL: http://localhost:5173

      - name: Instalar dependencias del Cliente
        run: npm ci
        working-directory: ./client

      - name: Lint del Cliente
        run: npm run lint
        working-directory: ./client

      - name: Validar compilación del Cliente
        run: npm run build --if-present
        working-directory: ./client

      - name: Notificar resultado a Slack
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "CI — Pruebas unitarias/integración - VaquitaApp"
          SLACK_MESSAGE: "Job build-and-test terminó. Revisa detalles en GitHub Actions."
          SLACK_COLOR: ${{ job.status }}

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Pruebas E2E con Puppeteer
  # Corre solo si build-and-test pasa.
  # ──────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      PORT: 3001
      MONGO_URI: mongodb://localhost:27017/vaquitaapp_e2e
      JWT_SECRET: super_clave_secreta_para_los_tests_de_github_actions
      JWT_EXPIRES_IN: 7d
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: noreply@vaquitaapp.local
      APP_BASE_URL: http://localhost:5173
      BASE_URL: http://localhost:5173
      E2E_EMAIL: e2e@vaquitaapp.test
      E2E_PASSWORD: E2ePassword1!
      E2E_NAME: Usuario E2E
      E2E_RUT: "11111111-1"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Instalar dependencias del sistema para Puppeteer (Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0 \
            fonts-liberation libappindicator3-1 lsb-release xdg-utils

      - name: Instalar dependencias del Servidor
        run: npm ci
        working-directory: ./server

      - name: Iniciar Servidor en background
        run: |
          nohup node src/server.js > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 3
        working-directory: ./server

      - name: Instalar dependencias del Cliente
        run: npm ci
        working-directory: ./client

      - name: Construir el Frontend
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: http://localhost:3001/api

      - name: Servir el Frontend en background (puerto 5173)
        run: |
          npm install -g serve
          nohup serve -s dist -l 5173 > /tmp/frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
          sleep 3
        working-directory: ./client

      - name: Verificar que backend y frontend responden
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:3001/api/health
          curl --fail --retry 5 --retry-delay 2 http://localhost:5173

      - name: Instalar dependencias E2E
        run: npm ci
        working-directory: ./e2e

      - name: Ejecutar seed (crear usuario E2E)
        run: node seed.js
        working-directory: ./e2e

      - name: Ejecutar pruebas E2E con Puppeteer
        run: npm test
        working-directory: ./e2e

      - name: Subir evidencias E2E (reporte HTML + screenshots en fallo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e/reports/
          retention-days: 7

      - name: Mostrar log del servidor (solo en fallo)
        if: failure()
        run: cat /tmp/server.log || true

      - name: Mostrar log del frontend (solo en fallo)
        if: failure()
        run: cat /tmp/frontend.log || true

      - name: Notificar resultado E2E a Slack
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "E2E — Puppeteer - VaquitaApp"
          SLACK_MESSAGE: "Job E2E (Puppeteer) terminó. Revisa evidencias en GitHub Actions."
          SLACK_COLOR: ${{ job.status }}

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Deploy del backend a staging (ECS Express Mode)
  # Corre solo en push a develop (o disparo manual sobre develop),
  # y solo si build-and-test y e2e pasaron. Autentica con Access Keys
  # (GitHub Secrets) del usuario vaquita-deploy-cli. Ver docs/deploy.md.
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ build-and-test, e2e ]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPO: 414061811062.dkr.ecr.us-east-1.amazonaws.com/vaquitaapp-api
      SERVICE_ARN: arn:aws:ecs:us-east-1:414061811062:service/default/vaquitaapp-api-staging
      STAGING_URL: https://va-e3512a79ac0e46b3b080c1c914857691.ecs.us-east-1.on.aws

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen (prod, amd64 nativo)
        run: |
          docker build --target prod \
            -t "$ECR_REPO:${{ github.sha }}" \
            -t "$ECR_REPO:latest" ./server
          docker push "$ECR_REPO:${{ github.sha }}"
          docker push "$ECR_REPO:latest"

      - name: Actualizar servicio ECS (preservando env vars)
        run: |
          # Lee el primaryContainer actual y cambia SOLO la imagen, conservando
          # containerPort, awsLogsConfiguration y todas las env vars (MONGO_URI,
          # JWT_SECRET, SMTP_*). Así los secretos nunca pasan por GitHub.
          PRIMARY=$(aws ecs describe-express-gateway-service \
            --service-arn "$SERVICE_ARN" --region "$AWS_REGION" \
            --query 'service.activeConfigurations[0].primaryContainer' --output json \
            | jq -c --arg img "$ECR_REPO:${{ github.sha }}" \
                '{image:$img, containerPort, awsLogsConfiguration, environment}')
          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" --region "$AWS_REGION" \
            --primary-container "$PRIMARY"

      - name: Verificar /api/health tras el rollout
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 10 "$STAGING_URL/api/health" | grep -q '"ok":true'; then
              echo "Health OK tras el deploy."
              exit 0
            fi
            echo "Esperando rollout del servicio... intento $i/30"
            sleep 10
          done
          echo "El servicio no respondió 200 en /api/health tras el deploy."
          exit 1

      - name: Notificar resultado del deploy a Slack
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Deploy backend (staging) - VaquitaApp"
          SLACK_MESSAGE: "Deploy a ECS staging del commit ${{ github.sha }} terminó."
          SLACK_COLOR: ${{ job.status }}
